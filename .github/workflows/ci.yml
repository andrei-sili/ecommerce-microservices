name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # Build and test every Java service. Fails fast per-service (fail-fast: false
  # keeps the matrix running so you see all broken services in one pass).
  build-java:
    name: Build & test (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [user, product, order, cart, payment]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - name: Build and verify
        working-directory: services/${{ matrix.service }}
        run: ./mvnw -B verify

  # Lint and test the notification service (Python/FastAPI). Only runs when the
  # service directory exists — it arrives via dev-fastapi's branch merge.
  lint-notification:
    name: Lint & test (notification)
    runs-on: ubuntu-latest
    if: hashFiles('services/notification/**') != ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        working-directory: services/notification
        run: pip install -e ".[dev]"
      - name: Ruff lint
        working-directory: services/notification
        run: ruff check .
      - name: Black format check
        working-directory: services/notification
        run: black --check .
      - name: Run tests
        working-directory: services/notification
        run: pytest

  # Validate the docker-compose file parses cleanly with all env vars present.
  validate-compose:
    name: Validate docker-compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check compose config
        working-directory: infra
        run: docker compose --env-file .env.example config -q

  # Scan the full git history for accidentally committed secrets.
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
