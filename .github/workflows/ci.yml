name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref so a fresh push doesn't queue behind a stale one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: jobs only read the repo. Tighten further per-job if a job needs more.
permissions:
  contents: read

jobs:
  # Build and test every Java service. Explicit matrix on purpose: adding a service to CI
  # is part of its Definition of Done, not runtime folder detection.
  # fail-fast: false keeps the matrix running so one pass shows every broken service.
  build-java:
    name: Build & test (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        service: [user, product, order, cart, payment]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - name: Build and verify
        working-directory: services/${{ matrix.service }}
        run: ./mvnw -B -ntp verify
      # Green-but-zero-tests is a FAILURE: a self-skipped suite (e.g. Testcontainers
      # silently skipping) must not pass as green. Count surefire + failsafe reports
      # and fail the job if the total is zero.
      - name: Fail if no tests ran
        working-directory: services/${{ matrix.service }}
        run: |
          total=$(find . -path '*/target/*-reports/TEST-*.xml' -print0 \
            | xargs -0 -r grep -ho 'tests="[0-9]*"' 2>/dev/null \
            | sed 's/[^0-9]//g' | awk '{s+=$1} END{print s+0}')
          echo "Total tests for ${{ matrix.service }}: $total"
          [ "$total" -gt 0 ] || { echo "::error::No tests ran for ${{ matrix.service }} — self-skip guard"; exit 1; }

  # Lint and test the notification service (Python/FastAPI). Runs unconditionally:
  # the service exists in the repo, so there is no folder gate.
  lint-notification:
    name: Lint & test (notification)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install dependencies
        working-directory: services/notification
        run: pip install -e ".[dev]"
      - name: Ruff lint
        working-directory: services/notification
        run: ruff check .
      - name: Black format check
        working-directory: services/notification
        run: black --check .
      - name: Mypy type check
        working-directory: services/notification
        run: mypy app
      - name: Run tests
        working-directory: services/notification
        run: pytest

  # Validate the docker-compose file parses cleanly with all env vars present.
  validate-compose:
    name: Validate docker-compose config
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check compose config
        working-directory: infra
        run: docker compose --env-file .env.example config -q

  # Scan the full git history for accidentally committed secrets.
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Render the Kustomize local overlay and schema-validate every manifest. Runs in
  # parallel to validate-compose. A real gate: a broken/invalid manifest fails the PR.
  # No cluster is created; secrets never leave the gitignored secret.env (CI fabricates
  # a placeholder one only so the secretGenerator can build).
  validate-k8s:
    name: Validate k8s manifests (kubeconform)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install kustomize + kubeconform (pinned, checksum-verified)
        run: |
          set -euo pipefail
          cd "$(mktemp -d)"
          curl -sSLf -o kustomize.tgz \
            "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.8.1/kustomize_v5.8.1_linux_amd64.tar.gz"
          echo "029a7f0f4e1932c52a0476cf02a0fd855c0bb85694b82c338fc648dcb53a819d  kustomize.tgz" | sha256sum -c -
          tar -xzf kustomize.tgz && sudo install -m 0755 kustomize /usr/local/bin/kustomize
          curl -sSLf -o kubeconform.tgz \
            "https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz"
          echo "95f14e87aa28c09d5941f11bd024c1d02fdc0303ccaa23f61cef67bc92619d73  kubeconform.tgz" | sha256sum -c -
          tar -xzf kubeconform.tgz kubeconform && sudo install -m 0755 kubeconform /usr/local/bin/kubeconform
      - name: Seed placeholder secret.env (the real one is gitignored; never committed)
        working-directory: infra/k8s/overlays/local
        run: cp secret.env.example secret.env
      - name: Render and validate manifests
        run: |
          kustomize build infra/k8s/overlays/local \
            | kubeconform -strict -summary -kubernetes-version 1.32.0 -schema-location default
      # Wave 5c: the observability kustomizations (Option C — vendored `helm template`)
      # contain prometheus-operator CRs (ServiceMonitor/Prometheus/…). kubeconform needs
      # their schemas or it red-fails the CRs, so add the prometheus-operator CR schema
      # catalog; `-skip CustomResourceDefinition` then skips ONLY the vendored upstream
      # CRD objects (no published JSON schema) — every CR stays strictly validated, and a
      # future typo'd apiVersion cannot slip through silently (unlike -ignore-missing-schemas).
      - name: Validate observability manifests (metrics + logs)
        run: |
          set -euo pipefail
          CRD='https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
          for component in metrics logs; do
            echo "== observability/$component =="
            kustomize build "infra/k8s/base/observability/$component" \
              | kubeconform -strict -summary -kubernetes-version 1.32.0 \
                  -schema-location default -schema-location "$CRD" -skip CustomResourceDefinition
          done
      # Wave 5d: the prod overlay repoints the same base at GHCR SHA-pinned images.
      # It carries no configMap/secretGenerator, so no secret.env seeding is needed,
      # and it pulls in core kinds only (observability is validated separately above).
      - name: Render and validate prod overlay
        run: |
          kustomize build infra/k8s/overlays/prod \
            | kubeconform -strict -summary -kubernetes-version 1.32.0 -schema-location default

  # Wave 5d: base64 is not encryption — a committed populated `kind: Secret` leaks its
  # values to anyone with repo read access and typically evades gitleaks. The guard
  # parses every tracked YAML document under infra/ (real parsing, not a text grep, so
  # vendored schema text cannot false-positive) and fails on any Secret with non-empty
  # data/stringData. Negative-tested: a synthetic populated Secret turns it RED.
  secret-guard:
    name: Committed-Secret guard (infra YAML)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Fail on populated kind Secret in tracked infra YAML
        run: |
          python3 -m pip install --quiet pyyaml
          python3 .github/scripts/check-committed-secrets.py

  # Wave 5d: report-only Trivy CVE scan (SARIF -> Security tab; exit-code 0 never
  # blocks — promotion to a blocking gate is a later slice, after the baseline is
  # clean). Scans the LOCALLY-built image (load: true, no push): at PR time nothing
  # exists in GHCR yet, so scanning a registry ref on a PR would be a bug.
  # Representative pair instead of all 6: the five Java images share one multi-stage
  # Maven -> eclipse-temurin:21-jre pattern (near-identical CVE surface), so user
  # (security-critical) + notification (python:3.12-slim) cover both image families
  # without five redundant multi-minute builds per PR.
  # trivy-action is pinned to the verified-safe v0.35.0 release (2026-03 supply-chain
  # attack: NEVER trivy CLI 0.69.4-0.69.6; v0.69.3 is the verified-safe CLI).
  trivy-image:
    name: Trivy image scan (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # upload-sarif; scoped to this job only
    strategy:
      fail-fast: false
      matrix:
        service: [user, notification]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      # Read-only reuse of the push-images cache (written on main); no cache-to so PR
      # branches don't evict the main-branch cache entries.
      - name: Build image locally (no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: services/${{ matrix.service }}
          platforms: linux/amd64
          load: true
          push: false
          tags: scan/${{ matrix.service }}-service:ci
          cache-from: type=gha,scope=${{ matrix.service }}
      - name: Trivy CVE scan (report-only)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0 (verified-safe re-release)
        with:
          scan-type: image
          image-ref: scan/${{ matrix.service }}-service:ci
          format: sarif
          output: trivy-image-${{ matrix.service }}.sarif
          exit-code: '0'
          version: v0.69.3 # verified-safe CLI; never 0.69.4-0.69.6
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@54f647b7e1bb85c95cddabcd46b0c578ec92bc1a # v4.36.3
        with:
          sarif_file: trivy-image-${{ matrix.service }}.sarif
          category: trivy-image-${{ matrix.service }}

  # Wave 5d: report-only Trivy misconfiguration scan over the Kubernetes manifests
  # (same safe pin and SARIF/report-only posture as trivy-image).
  trivy-config:
    name: Trivy k8s misconfig scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # upload-sarif; scoped to this job only
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Trivy misconfig scan (report-only)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0 (verified-safe re-release)
        with:
          scan-type: config
          scan-ref: infra/k8s
          format: sarif
          output: trivy-config.sarif
          exit-code: '0'
          version: v0.69.3 # verified-safe CLI; never 0.69.4-0.69.6
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@54f647b7e1bb85c95cddabcd46b0c578ec92bc1a # v4.36.3
        with:
          sarif_file: trivy-config.sarif
          category: trivy-config-infra-k8s
