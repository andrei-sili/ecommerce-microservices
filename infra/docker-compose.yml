# Wave 0 — databases only (database-per-service pattern).
# One Postgres container per service DB on a shared Docker network.
# Application services arrive in Wave 1+. Do NOT add Kong/Consul/RabbitMQ here.

name: ecommerce

services:
  user-db:
    image: postgres:16-alpine
    container_name: ecommerce-user-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${USER_DB_USER}
      POSTGRES_PASSWORD: ${USER_DB_PASSWORD}
      POSTGRES_DB: ${USER_DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - user-db-data:/var/lib/postgresql/data
    networks:
      - ecommerce-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${USER_DB_USER} -d ${USER_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  product-db:
    image: postgres:16-alpine
    container_name: ecommerce-product-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PRODUCT_DB_USER}
