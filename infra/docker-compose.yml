# Wave 4 / 5b — single edge. Kong (API Gateway) is the only host ingress on :8000; the 6 app
# services, the 6 DBs and RabbitMQ AMQP are no longer published to the host (reachable only
# on ecommerce-net by name). Kong routes via Docker DNS with its own active health checks
# (Docker DNS resolves dead containers, so the Compose edge KEEPS its upstreams+active checks).
# Wave 5b retired Consul: it was catalog/UI-only, never in Kong's request path, so removing it
# is safe; the K8s stack does discovery + health-gated routing natively (CoreDNS + readiness).
# Published host ports: Kong :8000, RabbitMQ UI :15672. Dev-only direct port access lives in the
# gitignored docker-compose.override.yml (auto-loaded when no -f is passed).
#
# Wave 3 — RabbitMQ broker + Payment + Notification. Topology (exchanges/queues/DLQs) is
# declared idempotently by each service at startup (Spring AMQP / aio-pika). No pre-loaded
# definitions file — RabbitMQ boots with RABBITMQ_DEFAULT_USER/PASS and services handle the rest.

name: ecommerce

services:
  user-db:
    image: postgres:16-alpine
    container_name: ecommerce-user-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${USER_DB_USER}
      POSTGRES_PASSWORD: ${USER_DB_PASSWORD}
      POSTGRES_DB: ${USER_DB_NAME}
    volumes:
      - user-db-data:/var/lib/postgresql/data
    networks:
      - ecommerce-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${USER_DB_USER} -d ${USER_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  product-db:
    image: postgres:16-alpine
    container_name: ecommerce-product-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PRODUCT_DB_USER}
      POSTGRES_PASSWORD: ${PRODUCT_DB_PASSWORD}
      POSTGRES_DB: ${PRODUCT_DB_NAME}
    volumes:
      - product-db-data:/var/lib/postgresql/data
    networks:
      - ecommerce-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PRODUCT_DB_USER} -d ${PRODUCT_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  order-db:
    image: postgres:16-alpine
    container_name: ecommerce-order-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${ORDER_DB_USER}
      POSTGRES_PASSWORD: ${ORDER_DB_PASSWORD}
      POSTGRES_DB: ${ORDER_DB_NAME}
    volumes:
      - order-db-data:/var/lib/postgresql/data
    networks:
      - ecommerce-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ORDER_DB_USER} -d ${ORDER_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  cart-db:
    image: postgres:16-alpine
    container_name: ecommerce-cart-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${CART_DB_USER}
      POSTGRES_PASSWORD: ${CART_DB_PASSWORD}
      POSTGRES_DB: ${CART_DB_NAME}
    volumes:
      - cart-db-data:/var/lib/postgresql/data
    networks:
      - ecommerce-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CART_DB_USER} -d ${CART_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  payment-db:
    image: postgres:16-alpine
    container_name: ecommerce-payment-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PAYMENT_DB_USER}
      POSTGRES_PASSWORD: ${PAYMENT_DB_PASSWORD}
      POSTGRES_DB: ${PAYMENT_DB_NAME}
    volumes:
      - payment-db-data:/var/lib/postgresql/data
    networks:
      - ecommerce-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PAYMENT_DB_USER} -d ${PAYMENT_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  notification-db:
    image: postgres:16-alpine
    container_name: ecommerce-notification-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${NOTIFICATION_DB_USER}
      POSTGRES_PASSWORD: ${NOTIFICATION_DB_PASSWORD}
      POSTGRES_DB: ${NOTIFICATION_DB_NAME}
    volumes:
      - notification-db-data:/var/lib/postgresql/data
    networks:
      - ecommerce-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${NOTIFICATION_DB_USER} -d ${NOTIFICATION_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # --- Application services (Wave 1) ---

  user-service:
    build:
      context: ../services/user
    image: ecommerce/user-service:dev
    container_name: ecommerce-user-service
    restart: unless-stopped
    depends_on:
      user-db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://user-db:5432/${USER_DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${USER_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${USER_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      # Slice 5e phase-2 signer flip pinned as versioned config (phase-3 grace-clock anchor); rollback = set HS256, validators stay dual-accept (JWT_ACCEPTED_ALGS) until phase 3.
      JWT_SIGNING_ALG: RS256
      # Slice 5e — RS256 key material delivered as read-only FILE mounts (never PEM-in-env:
      # compose vs --env-file newline semantics differ, moby#12997). user-service is the ONLY
      # signer, so it holds the PRIVATE key; its path is a hardcoded literal here (deliberately
      # NOT a shared .env var) so the private-key audit `grep JWT_PRIVATE_KEY_PATH` resolves to
      # user wiring alone. It also mounts the PUBLIC key — user validates its own inbound tokens.
      JWT_PRIVATE_KEY_PATH: /etc/jwt/private/jwt-rs256-private.pem
      JWT_PUBLIC_KEY_PATH: ${JWT_PUBLIC_KEY_PATH:-/etc/jwt/public/jwt-rs256-public.pem}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    volumes:
      - ./keys/jwt-rs256-private.pem:/etc/jwt/private/jwt-rs256-private.pem:ro
      - ./keys/jwt-rs256-public.pem:${JWT_PUBLIC_KEY_PATH:-/etc/jwt/public/jwt-rs256-public.pem}:ro
    networks:
      - ecommerce-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  product-service:
    build:
      context: ../services/product
    image: ecommerce/product-service:dev
    container_name: ecommerce-product-service
    restart: unless-stopped
    depends_on:
      product-db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://product-db:5432/${PRODUCT_DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${PRODUCT_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${PRODUCT_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      # Slice 5e — RS256 PUBLIC key as a read-only FILE mount (validation only; no private key).
      JWT_PUBLIC_KEY_PATH: ${JWT_PUBLIC_KEY_PATH:-/etc/jwt/public/jwt-rs256-public.pem}
      # Product fails fast at startup if this is unset; Order sends it as X-Internal-Api-Key.
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      # TTL for stock reservations; sweeper releases RESERVED rows past this deadline.
      RESERVATION_TTL_MINUTES: ${RESERVATION_TTL_MINUTES}
    volumes:
      - ./keys/jwt-rs256-public.pem:${JWT_PUBLIC_KEY_PATH:-/etc/jwt/public/jwt-rs256-public.pem}:ro
    networks:
      - ecommerce-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  # --- Application services (Wave 2) ---

  cart-service:
    build:
      context: ../services/cart
    image: ecommerce/cart-service:dev
    container_name: ecommerce-cart-service
    restart: unless-stopped
    depends_on:
      cart-db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://cart-db:5432/${CART_DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${CART_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${CART_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      # Slice 5e — RS256 PUBLIC key as a read-only FILE mount (validation only; no private key).
      JWT_PUBLIC_KEY_PATH: ${JWT_PUBLIC_KEY_PATH:-/etc/jwt/public/jwt-rs256-public.pem}
      # Override the bare-hostname default (http://product:8082) with the compose DNS name.
      PRODUCT_SERVICE_URL: http://product-service:8082
    volumes:
      - ./keys/jwt-rs256-public.pem:${JWT_PUBLIC_KEY_PATH:-/etc/jwt/public/jwt-rs256-public.pem}:ro
    networks:
      - ecommerce-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  order-service:
    build:
      context: ../services/order
    image: ecommerce/order-service:dev
    container_name: ecommerce-order-service
    restart: unless-stopped
    depends_on:
      order-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://order-db:5432/${ORDER_DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${ORDER_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${ORDER_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      # Slice 5e — RS256 PUBLIC key as a read-only FILE mount (validation only; no private key).
      JWT_PUBLIC_KEY_PATH: ${JWT_PUBLIC_KEY_PATH:-/etc/jwt/public/jwt-rs256-public.pem}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      # Override the bare-hostname defaults with the compose DNS names.
      CART_SERVICE_URL: http://cart-service:8083
      PRODUCT_SERVICE_URL: http://product-service:8082
      # RabbitMQ — outbox relay (OrderPlaced) + payment event consumer (Wave 3).
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST}
    volumes:
      - ./keys/jwt-rs256-public.pem:${JWT_PUBLIC_KEY_PATH:-/etc/jwt/public/jwt-rs256-public.pem}:ro
    networks:
      - ecommerce-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8084/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  # --- Wave 3: RabbitMQ broker + Payment + Notification ---

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: ecommerce-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    ports:
      # AMQP 5672 is intra-network only now; only the management UI is published.
      - "15672:15672"
    networks:
      - ecommerce-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  payment-service:
    build:
      context: ../services/payment
    image: ecommerce/payment-service:dev
    container_name: ecommerce-payment-service
    restart: unless-stopped
    depends_on:
      payment-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://payment-db:5432/${PAYMENT_DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${PAYMENT_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${PAYMENT_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      # Slice 5e — RS256 PUBLIC key as a read-only FILE mount (validation only; no private key).
      JWT_PUBLIC_KEY_PATH: ${JWT_PUBLIC_KEY_PATH:-/etc/jwt/public/jwt-rs256-public.pem}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET}
      PAYMENT_GATEWAY_API_KEY: ${PAYMENT_GATEWAY_API_KEY}
      # Payment calls Order with the user's forwarded JWT (user-scoped, not INTERNAL_API_KEY).
      ORDER_SERVICE_URL: http://order-service:8084
      # RabbitMQ — outbox relay (PaymentCompleted/Failed/Cancelled) (Wave 3).
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST}
    volumes:
      - ./keys/jwt-rs256-public.pem:${JWT_PUBLIC_KEY_PATH:-/etc/jwt/public/jwt-rs256-public.pem}:ro
    networks:
      - ecommerce-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8085/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  notification-service:
    build:
      context: ../services/notification
    image: ecommerce/notification-service:dev
    container_name: ecommerce-notification-service
    restart: unless-stopped
    depends_on:
      notification-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${NOTIFICATION_DB_USER}:${NOTIFICATION_DB_PASSWORD}@notification-db:5432/${NOTIFICATION_DB_NAME}
      EMAIL_API_KEY: ${EMAIL_API_KEY}
      # RabbitMQ — consumer: OrderPlaced + payment events (Wave 3).
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST}
    networks:
      - ecommerce-net
    healthcheck:
      # Uses stdlib urllib — no extra packages needed in any Python image.
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8086/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  # --- Wave 4: API Gateway (Kong) — the single host ingress ---

  kong:
    image: kong:3.9.3
    container_name: ecommerce-kong
    restart: unless-stopped
    depends_on:
      user-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
      cart-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_LISTEN: "0.0.0.0:8000"
      KONG_ADMIN_LISTEN: "127.0.0.1:8001"
      KONG_STATUS_LISTEN: "0.0.0.0:8100"
      KONG_LOG_LEVEL: notice
    volumes:
      - ./kong/kong.yml:/kong/kong.yml:ro
    ports:
      # Proxy ONLY — never 8001/8444 (Admin) or 8100 (status).
      - "8000:8000"
    networks:
      - ecommerce-net
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  ecommerce-net:
    name: ecommerce-net
    driver: bridge

volumes:
  user-db-data:
  product-db-data:
  order-db-data:
  cart-db-data:
  payment-db-data:
  notification-db-data:
  rabbitmq-data:
