      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  ecommerce-net:
    name: ecommerce-net
    driver: bridge

volumes:
  user-db-data:
  product-db-data:
  order-db-data:
  cart-db-data:
  payment-db-data:
  notification-db-data:
