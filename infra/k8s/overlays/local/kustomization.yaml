apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ecommerce

resources:
  - ../../base

# --- Non-secret config (committed) -------------------------------------------
# Per-service so the per-service SPRING_DATASOURCE_URL keys do not collide.
# JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=50 keeps heap (~256Mi) + non-heap under
# the 512Mi limit so the JVMs don't OOMKill on 8 GB. NOTE: user-service's
# Dockerfile hardcodes -XX:MaxRAMPercentage=75.0 in its ENTRYPOINT, and a
# command-line -XX arg WINS over JAVA_TOOL_OPTIONS (verified) — so this env is a
# no-op for user-service until dev-java drops/lowers that Dockerfile flag.
configMapGenerator:
  - name: user-config
    literals:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://user-db:5432/user_db
      - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=50
      # Slice 5e phase-2 signer flip pinned as versioned config (phase-3 grace-clock anchor);
      # rollback = HS256. Consumed by the user Deployment via envFrom user-config. Validators
      # stay dual-accept (JWT_ACCEPTED_ALGS) until phase 3 — never flip both in one deploy.
      - JWT_SIGNING_ALG=RS256
  - name: product-config
    literals:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://product-db:5432/product_db
      - RESERVATION_TTL_MINUTES=30
      - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=50
  - name: cart-config
    literals:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://cart-db:5432/cart_db
      - PRODUCT_SERVICE_URL=http://product-service:8082
      - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=50
  - name: order-config
    literals:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://order-db:5432/order_db
      - CART_SERVICE_URL=http://cart-service:8083
      - PRODUCT_SERVICE_URL=http://product-service:8082
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_VHOST=/
      - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=50
  - name: payment-config
    literals:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://payment-db:5432/payment_db
      - ORDER_SERVICE_URL=http://order-service:8084
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_VHOST=/
      - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=50
  - name: notification-config
    literals:
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_VHOST=/
  - name: user-db-config
    literals:
      - POSTGRES_DB=user_db
  - name: product-db-config
    literals:
      - POSTGRES_DB=product_db
  - name: order-db-config
    literals:
      - POSTGRES_DB=order_db
  - name: cart-db-config
    literals:
      - POSTGRES_DB=cart_db
  - name: payment-db-config
    literals:
      - POSTGRES_DB=payment_db
  - name: notification-db-config
    literals:
      - POSTGRES_DB=notification_db
  - name: rabbitmq-config
    literals:
      - RABBITMQ_DEFAULT_VHOST=/
  # Slice 5e — RS256 PUBLIC key (validation material, non-secret) as a hashed ConfigMap,
  # mounted read-only into all 5 Java services. Fed from the gitignored
  # overlays/local/keys/jwt-rs256-public.pem (up.sh / CI / `make k8s-validate` generate it
  # if absent — see runbook § "JWT keys"). The content-hash suffix rolls every consumer pod
  # when the key changes, so a rotation restarts the validators automatically.
  - name: jwt-public-key
    files:
      - jwt-rs256-public.pem=keys/jwt-rs256-public.pem

# --- Secrets (NEVER committed) -----------------------------------------------
# Reads the GITIGNORED infra/k8s/overlays/local/secret.env (same key scheme as
# infra/.env). Workloads consume individual keys via secretKeyRef so no
# service's container env carries another service's credentials. The content
# hash rolls pods automatically when a value changes.
secretGenerator:
  - name: ecommerce-secrets
    envs:
      - secret.env
  # Wave 5c: a STABLE-named Secret for Grafana's admin identity. The vendored
  # kube-prometheus-stack manifest (base/observability/metrics/rendered.yaml) references
  # `grafana-admin` by FIXED name via existingSecret — it can't follow the hash suffix
  # kustomize appends to `ecommerce-secrets`, so this one turns the suffix OFF. It is
  # applied by `kubectl apply -k overlays/local` (up.sh step 6), BEFORE the separate
  # metrics apply, so the name resolves when Grafana starts.
  # 5c-h: reads the DEDICATED gitignored grafana.env (GRAFANA_ADMIN_USER/_PASSWORD and
  # nothing else). secretGenerator cannot cherry-pick keys from an env file, so feeding
  # it secret.env mirrored EVERY app secret (JWT_SECRET included) into this Secret —
  # the 2-key file shrinks the blast radius to exactly the admin login. up.sh seeds
  # grafana.env (migrating GRAFANA_ADMIN_* out of an existing secret.env on first run);
  # no value is ever committed (grafana.env is gitignored).
  - name: grafana-admin
    options:
      disableNameSuffixHash: true
    envs:
      - grafana.env
  # Slice 5e — RS256 PRIVATE signing key as a hashed Secret, mounted ONLY into the user
  # Deployment (audit: the private key never reaches product/cart/order/payment). Fed from
  # the gitignored overlays/local/keys/jwt-rs256-private.pem (up.sh / CI / `make k8s-validate`
  # generate the keypair if absent — see runbook § "JWT keys"). It is a FILE-based Secret
  # (not an env key in ecommerce-secrets): PEM never travels through env.
  - name: jwt-signing
    files:
      - jwt-rs256-private.pem=keys/jwt-rs256-private.pem
