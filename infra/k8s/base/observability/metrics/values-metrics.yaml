# Slim kube-prometheus-stack values for the local k3d observability stack (Wave 5c,
# Option C). Rendered ONCE by regen.sh into the committed rendered.yaml; applied with
# `kubectl apply -k ... --server-side`. Intent: metrics + Grafana as a single pane of
# glass, sized for an ~11.6 GB laptop, no PVCs, no paging, ClusterIP-only (port-forward).

fullnameOverride: kps

# --- Alertmanager OFF: no paging in a local demo -----------------------------
alertmanager:
  enabled: false

# The self-monitoring "no Alertmanager" alert would fire forever with AM disabled;
# silence just that one (keep the rest of the useful default rules).
defaultRules:
  disabled:
    PrometheusNotConnectedToAlertmanagers: true

# --- k3s control-plane targets that are not externally scrapable: OFF so they
# don't show as permanently-DOWN targets. kubelet + coreDNS + kube-apiserver stay on.
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeEtcd:
  enabled: false
kubeProxy:
  enabled: false

# --- Prometheus (the metrics store) ------------------------------------------
prometheus:
  prometheusSpec:
    retention: 24h
    scrapeInterval: 30s
    # Pick up hand-written ServiceMonitors that do NOT carry the Helm release label
    # (ours don't). Without this, Prometheus silently scrapes nothing but the chart's own.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    scrapeConfigSelectorNilUsesHelmValues: false
    # No storageSpec => emptyDir (ephemeral, no PVC bloat). Demo data is disposable.
    resources:
      requests:
        cpu: 100m
        memory: 400Mi
      limits:
        memory: 800Mi

# --- Prometheus Operator ------------------------------------------------------
prometheusOperator:
  resources:
    requests:
      cpu: 50m
      memory: 100Mi
    limits:
      memory: 256Mi

# --- kube-state-metrics + node-exporter: keep (cheap, part of the showcase) ---
kube-state-metrics:
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 128Mi
prometheus-node-exporter:
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      memory: 64Mi

# --- Grafana (single pane of glass) ------------------------------------------
grafana:
  # Admin identity comes from the dedicated `grafana-admin` Secret (stable name, no
  # hash suffix) generated by overlays/local from the gitignored secret.env. NEVER a
  # literal password here (gitleaks + reviewer verify).
  admin:
    existingSecret: grafana-admin
    userKey: GRAFANA_ADMIN_USER
    passwordKey: GRAFANA_ADMIN_PASSWORD
  # Anonymous viewer OFF: admin is reached via the Secret over port-forward; anonymous
  # only adds attack surface for a port-forward-only demo.
  grafana.ini:
    auth.anonymous:
      enabled: false
  # ClusterIP; reached with `kubectl port-forward svc/kube-prometheus-stack-grafana 3000:80`
  # (the Grafana subchart does NOT inherit fullnameOverride, so its Service keeps the
  # release-prefixed name). No Ingress, no Kong route, no second NodePort.
  service:
    type: ClusterIP
  # Load any ConfigMap labelled grafana_dashboard: "1" from ALL namespaces (the baked
  # dashboards/ ConfigMaps). Prometheus datasource is provisioned by the chart (default);
  # Loki is added below as an extra datasource.
  sidecar:
    dashboards:
      enabled: true
      searchNamespaces: ALL
      label: grafana_dashboard
      labelValue: "1"
      # Point the sidecar-provisioned dashboards at the default (Prometheus) datasource
      # so ${DS_PROMETHEUS}-style panels resolve without manual import.
      defaultFolderName: ecommerce
    datasources:
      enabled: true
      defaultDatasourceEnabled: true
      # Fix the default Prometheus datasource uid so baked dashboards can pin it.
      uid: prometheus
  additionalDataSources:
    - name: Loki
      type: loki
      uid: loki
      access: proxy
      url: http://loki:3100
      jsonData:
        maxLines: 1000
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi
