# ServiceMonitors for the 5 Spring Boot services. Each exposes Micrometer's Prometheus
# registry at /actuator/prometheus on its app port (named `http`, 8081-8085). Unauth is
# acceptable ONLY because the endpoint is ClusterIP-internal and off the Kong edge.
# The Prometheus Operator selects these because values-metrics.yaml sets
# serviceMonitorSelectorNilUsesHelmValues=false (no release label required).
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: user-service
  namespace: ecommerce
  labels:
    app.kubernetes.io/part-of: ecommerce
spec:
  namespaceSelector:
    matchNames:
      - ecommerce
  selector:
    matchLabels:
      app.kubernetes.io/name: user-service
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 30s
      scheme: http
