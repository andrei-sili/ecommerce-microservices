apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  labels:
    app.kubernetes.io/name: user-service
    app.kubernetes.io/component: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: user-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: user-service
        app.kubernetes.io/component: app
    spec:
      automountServiceAccountToken: false
      initContainers:
        - name: wait-for-db
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - until pg_isready -h user-db -p 5432; do echo "waiting for user-db"; sleep 2; done
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
      containers:
        - name: user-service
          image: ecommerce/user-service:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8081
          envFrom:
            - configMapRef:
                name: user-config
          env:
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: ecommerce-secrets
                  key: USER_DB_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ecommerce-secrets
                  key: USER_DB_PASSWORD
            - name: ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: ecommerce-secrets
                  key: ADMIN_EMAIL
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ecommerce-secrets
                  key: ADMIN_PASSWORD
            # Slice 5e — user is the ONLY signer: it holds the PRIVATE key path (never any
            # other pod) and also the PUBLIC key (validates its own inbound tokens).
            - name: JWT_PRIVATE_KEY_PATH
              value: /etc/jwt/private/jwt-rs256-private.pem
            - name: JWT_PUBLIC_KEY_PATH
              value: /etc/jwt/public/jwt-rs256-public.pem
          volumeMounts:
            - name: jwt-private
              mountPath: /etc/jwt/private
              readOnly: true
            - name: jwt-public
              mountPath: /etc/jwt/public
              readOnly: true
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 320Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        # Slice 5e — PRIVATE key from a dedicated jwt-signing Secret, mounted ONLY here
        # (audit: the private key never reaches product/cart/order/payment). PUBLIC key
        # from the shared jwt-public-key ConfigMap. 0444 + readOnly: readable, unwritable.
        - name: jwt-private
          secret:
            secretName: jwt-signing
            defaultMode: 0444
        - name: jwt-public
          configMap:
            name: jwt-public-key
            defaultMode: 0444
