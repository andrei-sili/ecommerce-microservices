spring:
  application:
    name: product-service
  jackson:
    # FREEZE (commit 1 of this migration only): keeps Jackson 2's defaults under Jackson 3 so the
    # parent bump cannot change a single serialized byte. Removed in the ABSORB commit, which is
    # what lets any body diff be bisected to the defaults rather than to the version bump.
    use-jackson2-defaults: true
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      # Fail fast when the DB IP vanishes (K8s pod loss) so readiness flips within the probe
      # window; thresholds sit above normal OLTP latency to avoid flapping on transient load.
      connection-timeout: 8000
      validation-timeout: 3000
      keepalive-time: 30000
      data-source-properties:
        # socketTimeout (s): bounds a read on a connection to a gone IP instead of blocking
        # ~15 min on Linux TCP retransmission. Decisive lever for pod-loss detection.
        socketTimeout: 10
        connectTimeout: 5
        tcpKeepAlive: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8082}

security:
  jwt:
    # Slice 5e phase-3 posture: product validates RS256 only (default below); it never signs, so no
    # private key here. HS256 stays code-reachable behind the allowlist for an emergency rollback,
    # but the legacy secret is deleted (fail-closed, D3) — re-widening needs a git revert plus a NEW
    # secret, never a live env toggle. JwtProperties.secret binds null while HS256 is not accepted.
    accepted-algs: ${JWT_ACCEPTED_ALGS:RS256}
    # Key material arrives as mounted files (paths in env, never PEM content). Provided by P1-INFRA.
    public-keys:
      user-rs256-2026-07: ${JWT_PUBLIC_KEY_PATH}
  # Shared key for system-to-system calls to the internal reservation endpoints (Order -> Product).
  internal-api-key: ${INTERNAL_API_KEY}

reservation:
  # How long a RESERVED hold is valid before the sweeper releases it.
  ttl-minutes: ${RESERVATION_TTL_MINUTES:30}
  sweeper:
    # Fixed delay (and initial delay) between sweeper runs in milliseconds.
    delay-ms: ${RESERVATION_SWEEPER_DELAY_MS:60000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
