spring:
  application:
    name: product-service
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8082}

security:
  jwt:
    secret: ${JWT_SECRET}
  # Shared key for system-to-system calls to the internal reservation endpoints (Order -> Product).
  internal-api-key: ${INTERNAL_API_KEY}

reservation:
  # How long a RESERVED hold is valid before the sweeper releases it.
  ttl-minutes: ${RESERVATION_TTL_MINUTES:30}
  sweeper:
    # Fixed delay (and initial delay) between sweeper runs in milliseconds.
    delay-ms: ${RESERVATION_SWEEPER_DELAY_MS:60000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
