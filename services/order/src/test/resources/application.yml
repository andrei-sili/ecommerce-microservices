spring:
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    # Prevents RabbitAdmin from connecting and declaring topology at startup.
    dynamic: false
    # Load-bearing for the relay's "broker confirm != routable" logic — mirrors production
    # application.yml. The unroutable-relay integration test sources these from here (NOT from a
    # @DynamicPropertySource override), so dropping either one turns that test RED.
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: manual
        # Listener containers are not started; tests call consumer methods directly.
        auto-startup: false

server:
  port: 0

# Mirrors production exposure so the Prometheus scrape endpoint is exercised through the real
# security chain in PrometheusMetricsIntegrationTest (the test application.yml fully shadows main).
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

security:
  jwt:
    secret: test-secret-that-is-long-enough-for-hs256-1234567890

clients:
  cart:
    base-url: http://cart.test
  product:
    base-url: http://product.test
    internal-api-key: test-internal-api-key
  connect-timeout-ms: 2000
  read-timeout-ms: 5000

# Disables @EnableScheduling in SchedulingConfig so the relay never fires during tests.
# Relay tests call OutboxRelay.drain() directly.
app:
  scheduling:
    enabled: false
  outbox:
    relay:
      interval-ms: 1000
