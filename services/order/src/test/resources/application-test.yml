# Test OVERLAY for the `test` profile, not a second application.yml.
#
# It used to be `src/test/resources/application.yml`, which sits ahead of the shipped file on the
# test classpath and therefore REPLACED it wholesale: the suite validated a configuration it handed
# itself. Mutation M2 settled what that costs — emptying the SHIPPED file (dropping
# `default-property-inclusion`, flipping `property-naming-strategy` to LOWER_CAMEL_CASE) left all
# 135 tests green, so every casing/inclusion pin was blind to the exact regression it exists to
# catch. As a profile overlay the shipped file is loaded first and only the keys below are
# overridden.
#
# THE RULE THAT KEEPS THAT FIXED: nothing here may re-declare a key that production also declares.
# `spring.jackson.*`, `spring.rabbitmq.publisher-confirm-type` / `publisher-returns`,
# `acknowledge-mode`, `spring.jpa.*`, `spring.flyway.*` and the whole `management` block were all
# duplicated here and are deliberately gone — they now come from the shipped file, which is what
# makes a mutation of that file able to turn this suite RED. Anything added back below re-blinds the
# suite to that key. Only genuine test needs belong here.
spring:
  datasource:
    hikari:
      # The suite boots several distinct Spring contexts (the dual-accept allowlist variants each
      # pin their own accepted-algs), and every context opens its own pool against the single shared
      # Testcontainers Postgres. Cap the per-context pool so the sum stays well under the container's
      # max_connections — the default pool of 10 exhausted it ("too many clients already").
      maximum-pool-size: 3
      minimum-idle: 0
  rabbitmq:
    # Contexts that do not start a broker container never connect; the ones that do override host,
    # port and credentials from Testcontainers via @DynamicPropertySource.
    host: localhost
    port: 5672
    username: guest
    password: guest
    # Prevents RabbitAdmin from connecting and declaring topology at startup.
    dynamic: false
    listener:
      simple:
        # Listener containers are not started; tests call consumer methods directly.
        # PaymentEventListenerContainerIntegrationTest overrides this to true — it IS the container.
        auto-startup: false

server:
  port: 0

security:
  jwt:
    # Not a production key: the shipped file has no `secret` at all (phase-3 fail-closed, D3). HS256
    # stays exercisable here so the dual-accept matrix can prove both branches.
    secret: test-secret-that-is-long-enough-for-hs256-1234567890
    # The shipped default is RS256-only; the matrix needs both branches live. RS256-only / HS256-only
    # suites narrow it again with their own @DynamicPropertySource. The public-keys map is NOT
    # overridden here: it comes from the shipped file, whose kid `user-rs256-2026-07` resolves its
    # PEM path from ${JWT_PUBLIC_KEY_PATH}, supplied per-context in AbstractIntegrationTest.
    accepted-algs: HS256,RS256

clients:
  cart:
    base-url: http://cart.test
  product:
    base-url: http://product.test
    internal-api-key: test-internal-api-key

app:
  # Disables @EnableScheduling in SchedulingConfig so the relay never fires during tests.
  # Relay tests call OutboxRelay.drain() directly.
  scheduling:
    enabled: false
