spring:
  application:
    name: order-service
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      # Fail fast when the DB IP vanishes (K8s pod loss) so readiness flips within the probe
      # window; thresholds sit above normal OLTP latency to avoid flapping on transient load.
      connection-timeout: 8000
      validation-timeout: 3000
      keepalive-time: 30000
      data-source-properties:
        # socketTimeout (s): bounds a read on a connection to a gone IP instead of blocking
        # ~15 min on Linux TCP retransmission. Decisive lever for pod-loss detection.
        socketTimeout: 10
        connectTimeout: 5
        tcpKeepAlive: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    # Correlated confirms + returns so the relay can tell "broker accepted" (ack) apart from
    # "actually routed": Boot sets mandatory=true from publisher-returns and correlates every
    # publish + any basic.return to its CorrelationData. A returned (unroutable) or nack'd row is
    # NOT marked published — see OutboxRelay ("broker confirm != routable").
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: manual

server:
  port: ${SERVER_PORT:8084}

security:
  jwt:
    secret: ${JWT_SECRET}
    # Slice 5e dual-accept: Order validates both HS256 (legacy) and RS256 tokens issued by the User
    # Service. Order never signs — no private key / signing-alg here. RS256 public key arrives as a
    # mounted file (path in env, never PEM content); the kid is a literal map key.
    accepted-algs: ${JWT_ACCEPTED_ALGS:HS256,RS256}
    public-keys:
      user-rs256-2026-07: ${JWT_PUBLIC_KEY_PATH}

clients:
  cart:
    base-url: ${CART_SERVICE_URL:http://cart:8083}
  product:
    base-url: ${PRODUCT_SERVICE_URL:http://product:8082}
    internal-api-key: ${INTERNAL_API_KEY}
  connect-timeout-ms: ${CLIENTS_CONNECT_TIMEOUT_MS:2000}
  read-timeout-ms: ${CLIENTS_READ_TIMEOUT_MS:5000}

app:
  outbox:
    relay:
      interval-ms: ${OUTBOX_RELAY_INTERVAL_MS:1000}
      confirm-timeout-ms: ${OUTBOX_RELAY_CONFIRM_TIMEOUT_MS:5000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
