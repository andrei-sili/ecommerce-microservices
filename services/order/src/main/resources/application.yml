spring:
  application:
    name: order-service
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      # Fail fast when the DB IP vanishes (K8s pod loss) so readiness flips within the probe
      # window; thresholds sit above normal OLTP latency to avoid flapping on transient load.
      connection-timeout: 8000
      validation-timeout: 3000
      keepalive-time: 30000
      data-source-properties:
        # socketTimeout (s): bounds a read on a connection to a gone IP instead of blocking
        # ~15 min on Linux TCP retransmission. Decisive lever for pod-loss detection.
        socketTimeout: 10
        connectTimeout: 5
        tcpKeepAlive: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    publisher-confirm-type: simple
    listener:
      simple:
        acknowledge-mode: manual

server:
  port: ${SERVER_PORT:8084}

security:
  jwt:
    secret: ${JWT_SECRET}

clients:
  cart:
    base-url: ${CART_SERVICE_URL:http://cart:8083}
  product:
    base-url: ${PRODUCT_SERVICE_URL:http://product:8082}
    internal-api-key: ${INTERNAL_API_KEY}
  connect-timeout-ms: ${CLIENTS_CONNECT_TIMEOUT_MS:2000}
  read-timeout-ms: ${CLIENTS_READ_TIMEOUT_MS:5000}

app:
  outbox:
    relay:
      interval-ms: ${OUTBOX_RELAY_INTERVAL_MS:1000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
