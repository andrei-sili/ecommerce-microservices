spring:
  application:
    name: order-service
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8084}

security:
  jwt:
    secret: ${JWT_SECRET}

clients:
  cart:
    base-url: ${CART_SERVICE_URL:http://cart:8083}
  product:
    base-url: ${PRODUCT_SERVICE_URL:http://product:8082}
    internal-api-key: ${INTERNAL_API_KEY}
  connect-timeout-ms: ${CLIENTS_CONNECT_TIMEOUT_MS:2000}
  read-timeout-ms: ${CLIENTS_READ_TIMEOUT_MS:5000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
