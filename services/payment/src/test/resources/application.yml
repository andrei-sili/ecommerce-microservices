spring:
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  # RabbitMQ: localhost during tests. Business tests @MockitoBean OutboxRelay so no connection opens;
  # the non-mocked broker seam tests (OutboxRelay*IntegrationTest) point these at a Testcontainers
  # broker via @DynamicPropertySource and flip `dynamic` back on.
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    # No RabbitAdmin connecting/declaring topology at startup for the mocked-relay tests.
    dynamic: false
    # Load-bearing for the relay's "broker confirm != routable" logic — mirrors production
    # application.yml. The broker seam tests source these from HERE (not a @DynamicPropertySource
    # override), so dropping either one turns those tests RED.
    publisher-confirm-type: correlated
    publisher-returns: true

server:
  port: 0

security:
  jwt:
    # The legacy HS256 secret + the RS256 public keys are wired per-context from JwtTestKeys via
    # @DynamicPropertySource (AbstractIntegrationTest) — a single source, never a duplicated literal.
    # Only the validator allowlist default lives here; the contraction suites override it.
    accepted-algs: HS256,RS256
  webhook:
    secret: test-webhook-secret

clients:
  order:
    base-url: http://order-service.test
  connect-timeout-ms: 2000
  read-timeout-ms: 5000

payment:
  gateway:
    api-key: sandbox-test-key

outbox:
  relay:
    batch-size: 10
    confirm-timeout-ms: 5000
    fixed-delay-ms: 60000

# Keeps @EnableScheduling (SchedulingConfig) off during tests so the relay never auto-fires; the
# broker seam tests call OutboxRelay.drain() directly for deterministic red->green assertions.
app:
  scheduling:
    enabled: false
