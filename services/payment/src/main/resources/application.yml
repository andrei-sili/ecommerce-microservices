spring:
  application:
    name: payment-service
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      # Fail fast when the DB IP vanishes (K8s pod loss) so readiness flips within the probe
      # window; thresholds sit above normal OLTP latency to avoid flapping on transient load.
      connection-timeout: 8000
      validation-timeout: 3000
      keepalive-time: 30000
      data-source-properties:
        # socketTimeout (s): bounds a read on a connection to a gone IP instead of blocking
        # ~15 min on Linux TCP retransmission. Decisive lever for pod-loss detection.
        socketTimeout: 10
        connectTimeout: 5
        tcpKeepAlive: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    publisher-confirm-type: correlated
    publisher-returns: true

server:
  port: ${SERVER_PORT:8085}

security:
  jwt:
    # Slice 5e phase-3 posture: payment validates RS256 only (default below). HS256 stays
    # code-reachable behind JWT_ACCEPTED_ALGS for an emergency rollback, but the legacy secret is
    # deleted (fail-closed, D3) — re-widening needs a git revert plus a NEW secret, never a live env
    # toggle. Payment never signs — no private key, no signing-alg here.
    accepted-algs: ${JWT_ACCEPTED_ALGS:RS256}
    # Key material arrives as a mounted file (path in env, never PEM content). Provided by P1-INFRA.
    # The kid is a literal YAML key; the path value is env-overridable.
    public-keys:
      user-rs256-2026-07: ${JWT_PUBLIC_KEY_PATH}
  webhook:
    secret: ${PAYMENT_WEBHOOK_SECRET}

clients:
  order:
    base-url: ${ORDER_SERVICE_URL:http://order-service:8084}
  connect-timeout-ms: ${CLIENTS_CONNECT_TIMEOUT_MS:2000}
  read-timeout-ms: ${CLIENTS_READ_TIMEOUT_MS:5000}

payment:
  gateway:
    api-key: ${PAYMENT_GATEWAY_API_KEY:sandbox-key}

outbox:
  relay:
    batch-size: ${OUTBOX_RELAY_BATCH_SIZE:50}
    confirm-timeout-ms: ${OUTBOX_RELAY_CONFIRM_TIMEOUT_MS:5000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
