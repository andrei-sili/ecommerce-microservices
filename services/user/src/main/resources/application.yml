spring:
  application:
    name: user-service
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      pool-name: user-hikari
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      # Fail fast when the DB IP vanishes (K8s pod loss) so readiness flips within the probe
      # window; thresholds sit above normal OLTP latency to avoid flapping on transient load.
      connection-timeout: 8000
      validation-timeout: 3000
      keepalive-time: 30000
      data-source-properties:
        # socketTimeout (s): bounds a read on a connection to a gone IP instead of blocking
        # ~15 min on Linux TCP retransmission. Decisive lever for pod-loss detection.
        socketTimeout: 10
        connectTimeout: 5
        tcpKeepAlive: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8081}

security:
  jwt:
    secret: ${JWT_SECRET}
    access-token-ttl-seconds: ${JWT_ACCESS_TTL_SECONDS:900}
    refresh-token-ttl-seconds: ${JWT_REFRESH_TTL_SECONDS:604800}
    issuer: user-service

admin:
  bootstrap:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
