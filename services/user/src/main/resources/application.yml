spring:
  application:
    name: user-service
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      pool-name: user-hikari
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      # Fail fast when the DB IP vanishes (K8s pod loss) so readiness flips within the probe
      # window; thresholds sit above normal OLTP latency to avoid flapping on transient load.
      connection-timeout: 8000
      validation-timeout: 3000
      keepalive-time: 30000
      data-source-properties:
        # socketTimeout (s): bounds a read on a connection to a gone IP instead of blocking
        # ~15 min on Linux TCP retransmission. Decisive lever for pod-loss detection.
        socketTimeout: 10
        connectTimeout: 5
        tcpKeepAlive: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null
    # A `serialization:` entry for Jackson's WRITE_DATES_AS_TIMESTAMPS flag stood here and was
    # deleted, with NO replacement key (contract B8). Jackson 3 moved that flag off
    # SerializationFeature onto DateTimeFeature, and Boot binds `spring.jackson.serialization.*` by
    # SerializationFeature constant name — so the key no longer resolves and every context fails to
    # start on a property-binding error that reads like an unrelated config problem. No replacement
    # is added because Jackson 3 already defaults the flag OFF: dates stay ISO-8601 strings. That is
    # asserted, not assumed, in
    # JacksonBindingIntegrationTest#bootMapper_writesDatesAsIsoStrings_notEpochNumbers.
    # The old key is named by its enum constant, not spelled in kebab-case: B8's gate greps
    # `services/` for that exact token, and a comment recording a deletion must not read to a
    # scanner as a surviving declaration.

server:
  port: ${SERVER_PORT:8081}

security:
  jwt:
    access-token-ttl-seconds: ${JWT_ACCESS_TTL_SECONDS:900}
    refresh-token-ttl-seconds: ${JWT_REFRESH_TTL_SECONDS:604800}
    issuer: user-service
    # Slice 5e phase-3 posture: the issuer signs RS256 and validators accept RS256 only (defaults
    # below). HS256 stays code-reachable behind these flags for an emergency rollback, but the legacy
    # secret is deleted (fail-closed, D3) — re-widening needs a git revert plus a NEW secret, never a
    # live env toggle. Both flags stay independently deployable — never coupled in one release.
    signing-alg: ${JWT_SIGNING_ALG:RS256}
    accepted-algs: ${JWT_ACCEPTED_ALGS:RS256}
    # Key material arrives as mounted files (paths in env, never PEM content). Provided by P1-INFRA.
    private-key-path: ${JWT_PRIVATE_KEY_PATH}
    public-keys:
      user-rs256-2026-07: ${JWT_PUBLIC_KEY_PATH}

admin:
  bootstrap:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
