spring:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

security:
  jwt:
    secret: test-jwt-secret-that-is-at-least-32-bytes-long-0123456789
    access-token-ttl-seconds: 900
    refresh-token-ttl-seconds: 604800
    issuer: user-service-test

admin:
  bootstrap:
    email: ""
    password: ""
