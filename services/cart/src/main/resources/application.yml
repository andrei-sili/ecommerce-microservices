spring:
  application:
    name: cart-service
  jackson:
    # FREEZE half of the two-commit migration: keeps Jackson 2's defaults while the version and the
    # import moves land, so serialized output stays byte-identical and any body diff found later in
    # the fleet bisects to the absorbed defaults rather than to the bump. Removed in the next commit.
    use-jackson2-defaults: true
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      # Fail fast when the DB IP vanishes (K8s pod loss) so readiness flips within the probe
      # window; thresholds sit above normal OLTP latency to avoid flapping on transient load.
      connection-timeout: 8000
      validation-timeout: 3000
      keepalive-time: 30000
      data-source-properties:
        # socketTimeout (s): bounds a read on a connection to a gone IP instead of blocking
        # ~15 min on Linux TCP retransmission. Decisive lever for pod-loss detection.
        socketTimeout: 10
        connectTimeout: 5
        tcpKeepAlive: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8083}

security:
  jwt:
    # Slice 5e phase-3 posture: validators accept RS256 only (default below). Cart never signs.
    # HS256 stays code-reachable behind JWT_ACCEPTED_ALGS for an emergency rollback, but the legacy
    # secret binding is deleted (fail-closed, D3) — re-widening needs a git revert plus a NEW secret,
    # never a live env toggle.
    accepted-algs: ${JWT_ACCEPTED_ALGS:RS256}
    # Key material arrives as a mounted FILE (path in env, never PEM content). Provided by P1-INFRA.
    # The kid is a literal map key (never reused); the path value is env-overridable.
    public-keys:
      user-rs256-2026-07: ${JWT_PUBLIC_KEY_PATH}

product:
  service:
    base-url: ${PRODUCT_SERVICE_URL:http://product:8082}
    connect-timeout-ms: ${PRODUCT_SERVICE_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${PRODUCT_SERVICE_READ_TIMEOUT_MS:3000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
