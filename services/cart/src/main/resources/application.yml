spring:
  application:
    name: cart-service
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      # Fail fast when the DB IP vanishes (K8s pod loss) so readiness flips within the probe
      # window; thresholds sit above normal OLTP latency to avoid flapping on transient load.
      connection-timeout: 8000
      validation-timeout: 3000
      keepalive-time: 30000
      data-source-properties:
        # socketTimeout (s): bounds a read on a connection to a gone IP instead of blocking
        # ~15 min on Linux TCP retransmission. Decisive lever for pod-loss detection.
        socketTimeout: 10
        connectTimeout: 5
        tcpKeepAlive: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8083}

security:
  jwt:
    secret: ${JWT_SECRET}
    # Slice 5e dual-accept: validate both legacy HS256 and RS256 (post-flip). Cart never signs.
    # Rollback/contraction is config-only via JWT_ACCEPTED_ALGS (e.g. RS256 once HS256 is retired).
    accepted-algs: ${JWT_ACCEPTED_ALGS:HS256,RS256}
    # Key material arrives as a mounted FILE (path in env, never PEM content). Provided by P1-INFRA.
    # The kid is a literal map key (never reused); the path value is env-overridable.
    public-keys:
      user-rs256-2026-07: ${JWT_PUBLIC_KEY_PATH}

product:
  service:
    base-url: ${PRODUCT_SERVICE_URL:http://product:8082}
    connect-timeout-ms: ${PRODUCT_SERVICE_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${PRODUCT_SERVICE_READ_TIMEOUT_MS:3000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
